name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f backend/pom.xml spotless:check clean verify
      - uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run format:check && npm run lint && npm test && npm run build
      - run: python3 -m pip install -r scripts/requirements-quality.txt && python3 -m black --check scripts && python3 -m py_compile scripts/*.py && python3 -m unittest discover -s scripts -p "test_*.py" && python3 scripts/release-check.py
      - run: git diff --check
      - name: Fresh Compose and business verification
        run: |
          python3 scripts/init-env.py
          docker compose -p leasehub-ci config --quiet
          docker compose -p leasehub-ci up --build -d --wait --wait-timeout 600
          python3 scripts/smoke.py --env-file .env --private-state "$RUNNER_TEMP/leasehub-ci-state.json"
      - name: Clean isolated resources
        if: always()
        run: docker compose -p leasehub-ci down -v --remove-orphans
